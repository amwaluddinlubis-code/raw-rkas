name: SPJ Critical Verification

on:
  push:
    branches:
      - main
      - gui-standardization
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches:
      - main
      - gui-standardization
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spj-critical-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and SPJ critical tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject tracked private and backup artifacts
        shell: bash
        run: |
          prohibited_files="$(git ls-files | grep -Ei '(^public/.*\.(sql|rar)$|^database/migrations/.*\.rar$|^config/.*\.lnk$)' || true)"
          if [ -n "$prohibited_files" ]; then
            echo "Tracked private or backup artifacts are not allowed:"
            echo "$prohibited_files"
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite, zip, gd
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          mkdir -p database storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
          touch database/testing.sqlite

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Check locked platform requirements
        run: composer check-platform-reqs --lock

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        run: php artisan key:generate --no-interaction

      - name: Install frontend dependencies
        run: npm ci

      - name: Repository Pint check (advisory)
        continue-on-error: true
        run: php vendor/bin/pint --test

      - name: Frontend build
        run: npm run build

      - name: Blade compile check
        run: php artisan view:cache --no-interaction

      - name: SPJ critical tests
        run: php artisan test --testsuite="SPJ Critical" --compact

      - name: Reset test database before unit suite
        shell: bash
        run: |
          rm -f database/testing.sqlite database/testing.sqlite-shm database/testing.sqlite-wal
          touch database/testing.sqlite

      - name: Full unit test suite
        shell: bash
        run: |
          set -o pipefail
          php artisan test --testsuite="Unit" --compact 2>&1 | tee storage/logs/unit-test-output.log

      - name: Upload unit failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: storage/logs/unit-test-output.log
          if-no-files-found: warn
          retention-days: 7

      - name: Full feature test suite
        run: php artisan test --testsuite="Feature" --compact
